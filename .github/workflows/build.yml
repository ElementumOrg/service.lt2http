name: build

on:
    push:
        branches:
            - "*"
        tags:
            - v*
    pull_request:
        branches:
            - "*"
    # Triggered by the lt2http build with the branch its binaries come from
    workflow_dispatch:
        inputs:
            binaries_repo:
                description: "Repository to download binaries from (owner/repo)"
                required: false
                type: string
                default: "ElementumOrg/lt2http"
            binaries_branch:
                description: "Branch to download binaries from"
                required: false
                type: string
                default: "master"
            binaries_run_id:
                description: "Run to download binaries from (the latest successful run of the branch if empty)"
                required: false
                type: string
                default: ""

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install flake8
              run: pip install flake8==7.1.2

            - name: Lint
              run: flake8

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: lint
        # Fork PRs get no secrets, so binaries can't be downloaded
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Append commit SHA to version
              if: ${{ !startsWith(github.ref, 'refs/tags/') }}
              run: |
                import re
                import subprocess

                sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()

                with open("addon.xml", "r") as f:
                    content = f.read()

                def replace_version(match):
                    old = match.group(2)
                    new = f"{old}+g{sha}"
                    print(f"Version: {old} -> {new}")
                    return f'{match.group(1)}"{new}"'

                content = re.sub(r'(<addon[^>]*?version=)"([^"]+)"', replace_version, content, count=1)

                with open("addon.xml", "w") as f:
                    f.write(content)
              shell: python

            - name: Download binaries
              uses: dawidd6/action-download-artifact@v17
              with:
                  github_token: ${{ secrets.GH_TOKEN }}
                  repo: ${{ inputs.binaries_repo || 'ElementumOrg/lt2http' }}
                  # The triggering run is still in progress, so a branch search would find the previous run.
                  # branch and run_id cannot be used together, an empty value counts as not set.
                  branch: ${{ !inputs.binaries_run_id && (inputs.binaries_branch || 'master') || '' }}
                  run_id: ${{ inputs.binaries_run_id }}
                  workflow: build.yml
                  workflow_conclusion: success
                  path: resources/bin
                  name: lt2http-binaries

            # The add-on downloads release binaries over bundled ones unless resources/bin/<os>-<arch>/version
            # is at least the add-on version, so stamp every platform with the version of this build
            - name: Extract binaries
              run: |
                  cd resources/bin
                  unzip -o lt2http-binaries.zip
                  rm -f lt2http-binaries.zip
                  version=$(sed -ne 's/.*<addon[^>]*version="\([^"]*\)".*/\1/p' ../../addon.xml)
                  for dir in */; do
                      printf '%s' "${version}" > "${dir}version"
                  done
                  ls -la */

            - name: Build
              run: make zip BINARIES=1

            - name: Setup gh actions artifact client
              uses: lhotari/gh-actions-artifact-client@v2

            # Uploaded as is, so the artifact is the add-on zip and not a zip in a zip
            - name: Upload add-on zip
              run: |
                  for file in service.lt2http-*.zip; do
                      echo "Uploading ${file}"
                      gh-actions-artifact-client.js upload "${file}" --retentionDays=7 < "${file}"
                  done
